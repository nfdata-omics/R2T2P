repository_type: pipeline

nf_core_version: 3.3.1

lint:
  files_unchanged:
    - .github/CONTRIBUTING.md
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml

template:
  org: nfdata-omics
  name: R2T2P
  description: A de novo computational discovery pipeline from RNA to protein
  author: R. Albanese, M. Bonfanti
  version: 0.1.0dev
  force: true
  outdir: .
  skip_features:
    - gitpod
    - codespaces
    - rocrate
  is_nfcore: false
