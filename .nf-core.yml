lint:
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
  files_unchanged:
    - .github/CONTRIBUTING.md
    - .prettierignore
    - .github/CONTRIBUTING.md
    - .prettierignore
    - CODE_OF_CONDUCT.md
    - assets/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_light.png
    - docs/images/nf-core-r2t2p_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
  multiqc_config: false
  nextflow_config:
    - manifest.name
    - manifest.homePage
    - validation.help.beforeText
    - validation.help.afterText
    - validation.summary.beforeText
    - validation.summary.afterText
  correct_meta_inputs:
    - modules/nf-core/star/align/meta.yml
    - modules/nf-core/cat/fastq/main.nf
nf_core_version: 3.5.1
repository_type: pipeline
template:
  author: R. Albanese, M. Bonfanti
  description: A de novo computational discovery pipeline from RNA to protein
  force: false
  is_nfcore: false
  name: R2T2P
  org: nfdata-omics
  outdir: .
  skip_features:
    - gitpod
    - codespaces
    - rocrate
  version: 0.1.0dev
